# Exemplo de regra para o SEU config.yml do cloudflared (nao substitui o arquivo: ADICIONE o bloco).
# O comando  servidor.bat link  mostra o seu prefixo real (ac-xxxxxxxxxxxx). Uma regra so cobre o
# link publico de download (/download) e o painel secreto; o resto do dominio segue com as suas outras APIs.
tunnel: SEU-TUNEL-ID
credentials-file: C:\Users\VOCE\.cloudflared\SEU-TUNEL-ID.json
ingress:
  # ... suas regras existentes ...
  - hostname: ac.cabro.me
    path: ^/(download|ac-xxxxxxxxxxxx)(/|$)
    service: http://127.0.0.1:8765
  - service: http_status:404
# DNS (uma vez):  cloudflared tunnel route dns SEU-TUNEL ac.cabro.me
