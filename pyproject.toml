[project]
name = "autoclick"
version = "0.13.1"
description = "Autoclick inteligente: detecta botões na tela por imagem e clica com regras por botão"
requires-python = ">=3.10"
dependencies = [
    "mss",
    "numpy",
    "opencv-python-headless",
]

[project.optional-dependencies]
ocr = ["pytesseract"]

[project.scripts]
autoclick = "autoclick.inicio:principal"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autoclick"]

[tool.pyright]
pythonPlatform = "Windows"
include = ["autoclick", "tools"]
