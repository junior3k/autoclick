[project]
name = "autoclick"
version = "0.12.0"
description = "Autoclick inteligente: detecta botões na tela por imagem e clica com regras por botão"
requires-python = ">=3.10"
dependencies = [
    "mss",
    "numpy",
    "opencv-python-headless",
]

[project.optional-dependencies]
ocr = ["pytesseract"]
servidor = ["fastapi>=0.110", "uvicorn>=0.29", "starlette>=0.40"]

[project.scripts]
autoclick = "autoclick.inicio:principal"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autoclick"]
